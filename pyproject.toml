[project]
name = "clientwipe"
version = "0.1.0"
description = "Sanitisation automatisee et auditable de postes de pentest entre deux missions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Soufyane Bouguelmouna" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
clientwipe = "clientwipe.cli:main"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clientwipe"]
