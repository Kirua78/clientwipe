# Configuration ClientWipe.
#
# "full_reset" pilote le mode par defaut du declenchement par cle USB
# (clientwipe trigger) : destruction de la cle LUKS si le peripherique en
# est equipe, puis reimagage complet au prochain demarrage. Adaptez
# "device" a la partition racine reelle du poste et "boot_entry" au nom
# exact de l'entree GRUB qui lance l'environnement de restauration
# Clonezilla/Rescuezilla (a preparer en amont sur chaque poste).
full_reset:
  device: /dev/sda3
  boot_entry: "Clonezilla Recovery"
  # Optionnel mais recommande : point de montage (typiquement la cle USB
  # declencheuse elle-meme, montee a un emplacement fixe prepare lors du
  # deploiement) ou sauvegarder l'en-tete LUKS avant destruction de la cle.
  # Permet un vrai retour en arriere (cryptsetup luksHeaderRestore) en cas
  # de declenchement par erreur. Sans cette ligne, la destruction de cle
  # est definitive des la confirmation.
  # header_backup_dir: /mnt/clientwipe-usb/luks-headers

# "targets" et "passes" ne servent qu'au mode --mode targeted (effacement
# cible fichier par fichier, sans reimagage/redemarrage) : les chemins sont
# des patterns glob relatifs a la racine passee via --root. Adaptez cette
# liste a vos outils et a votre arborescence reelle.

passes: 3

targets:
  - name: burp-projects
    patterns:
      - "**/*.burp"
      - ".BurpSuite/**"

  - name: ssh-keys
    patterns:
      - ".ssh/id_*"
      - ".ssh/known_hosts"

  - name: vpn-configs
    patterns:
      - "**/*.ovpn"
      - ".openvpn/**"

  - name: shell-history
    patterns:
      - ".bash_history"
      - ".zsh_history"

  - name: browser-profiles
    patterns:
      - ".mozilla/firefox/**"
      - ".config/google-chrome/**"

  - name: temp-and-downloads
    patterns:
      - "Downloads/**"
      - "tmp/**"

  # Un pattern commencant par "/" est absolu : il est resolu depuis la
  # racine du systeme de fichiers, independamment de --root. Utile pour des
  # emplacements connus hors du profil utilisateur (outils installes dans
  # /opt, point de montage d'un disque de loot...).
  # - name: opt-tools
  #   patterns:
  #     - "/opt/pentest-tools/**"
